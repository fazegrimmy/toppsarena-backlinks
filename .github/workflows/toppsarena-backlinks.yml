name: TopPSArena - Free directory submission

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview first; submit only after reviewing target sites'
        type: choice
        default: preview
        required: true
        options:
          - preview
          - submit
      confirmation:
        description: 'For submit mode type SUBMIT'
        type: string
        required: false
      contact_email:
        description: 'Public contact email for submissions (submit mode only)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: toppsarena-backlink-submissions
  cancel-in-progress: false

jobs:
  backlinkflow:
    name: Preview or attempt three free directory submissions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirmation }}
      CONTACT_EMAIL: ${{ inputs.contact_email }}
    steps:
      - name: Validate manual submission approval
        shell: bash
        run: |
          if [[ "$RUN_MODE" == "submit" ]]; then
            if [[ "$CONFIRM" != "SUBMIT" ]]; then
              echo 'Blocked: type SUBMIT in the confirmation input.'
              exit 1
            fi
            if [[ -z "$CONTACT_EMAIL" || "$CONTACT_EMAIL" != *@* ]]; then
              echo 'Blocked: please supply a public contact email.'
              exit 1
            fi
          fi
          if [[ "$RUN_MODE" != "preview" && "$RUN_MODE" != "submit" ]]; then
            echo 'Invalid mode'
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check out pinned open-source BacklinkFlow
        shell: bash
        run: |
          mkdir engine
          cd engine
          git init -q
          git remote add origin https://github.com/imsankz/backlinkflow.git
          git fetch -q --depth 1 origin b312c9e83b6f6e9b4fd012bc5eb505a7062dde7d
          git checkout -q FETCH_HEAD
          npm install --no-audit --no-fund
          npm run build

      - name: Configure TopPSArena without any paid AI API
        working-directory: engine
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const yaml = require('js-yaml');
          const config = {
            siteName: 'TopPSArena',
            siteUrl: 'https://toppsarena.com',
            siteEmail: process.env.CONTACT_EMAIL || '',
            siteDescription: 'TopPSArena is a free multi-game private server directory where players discover gaming communities, explore server profiles and vote in game-specific rankings. Server owners can list their communities and view listing performance.',
            tags: ['gaming', 'private servers', 'game server directory', 'gaming communities', 'server voting'],
            contentDomain: 'gaming communities and private server listings',
            writingSample: 'Explore private game servers and vote for your favourites on TopPSArena. Server owners can create free listings and monitor engagement.',
            ai: { provider: 'none', baseUrl: '', apiKey: '', model: '', maxCallsPerRun: 0 },
            pacing: { minSeconds: 90, perDay: 3 }
          };
          fs.writeFileSync('linkflow.config.json', JSON.stringify(config, null, 2));

          // Use a limited allowlist. These are candidates, not guaranteed free live listings.
          const allow = ['ASR', 'Offpagesavvy', 'WebsiteHunt', '10words'];
          const db = yaml.load(fs.readFileSync('data/directories.yaml', 'utf8'));
          const selected = {};
          const found = new Set();
          for (const [category, entries] of Object.entries(db)) {
            for (const item of entries) {
              if (!allow.includes(item.name)) continue;
              if (item.auto !== 'yes' || item.type !== 'form' || item.lang !== 'en') continue;
              if (['paid', 'dead'].includes(item.status)) continue;
              if (!item.submitUrl?.startsWith('https://')) continue;
              if (/paid|badge required|reciprocal/i.test(item.notes || '')) continue;
              (selected[category] ||= []).push(item);
              found.add(item.name);
            }
          }
          const missing = allow.filter(name => !found.has(name));
          if (missing.length) throw new Error('Candidate unavailable in upstream list: ' + missing.join(', '));
          fs.writeFileSync('data/directories.yaml', yaml.dump(selected));
          console.log('Candidate directories:', [...found].join(', '));
          console.log('No paid AI API is configured.');
          JS

      - name: Install browser for live mode only
        if: inputs.mode == 'submit'
        working-directory: engine
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Run preview or limited submission
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          if [[ "$RUN_MODE" == "preview" ]]; then
            node bin/linkflow.js submit https://toppsarena.com --dry-run --limit 4 2>&1 | tee submission-log.txt
          else
            node bin/linkflow.js submit https://toppsarena.com --go --limit 4 2>&1 | tee submission-log.txt
          fi

      - name: Save logs and attempted-submission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toppsarena-backlink-results
          path: |
            engine/submission-log.txt
            engine/.linkflow/tracker.json
            engine/.linkflow/report.md
            engine/.linkflow/proofs/
          retention-days: 7
          if-no-files-found: warn
