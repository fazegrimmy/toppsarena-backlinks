name: TopPSArena - 519 directory campaign

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview all 519 candidates or submit to qualifying forms'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - submit
      confirmation:
        description: 'Type SUBMIT for live mode'
        required: false
        type: string
      contact_email:
        description: 'Public TopPSArena contact email (only for submit mode)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/toppsarena-backlinks.yml'
      - 'scripts/campaign.mjs'
      - 'campaign/candidates.json'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: toppsarena-directory-campaign
  cancel-in-progress: false

jobs:
  campaign:
    name: Directory campaign shard ${{ matrix.shard }} of 5
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'preview' }}
      SHARD: ${{ matrix.shard }}
      CONFIRM: ${{ inputs.confirmation }}
      CONTACT_EMAIL: ${{ inputs.contact_email }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out candidate queue and previous checkpoints
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install free browser automation library
        run: npm install --no-audit --no-fund

      - name: Validate the campaign script
        run: npm run check

      - name: Install browser for approved live mode only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'submit'
        run: npx playwright install --with-deps chromium

      - name: Preview all candidates or run live screening
        run: node scripts/campaign.mjs

      - name: Upload screening records for this shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toppsarena-directory-shard-${{ matrix.shard }}
          path: |
            results/
            state/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30
