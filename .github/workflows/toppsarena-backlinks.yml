name: TopPSArena - Verified free backlinks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Submit to documented free API directories and verify, or verify only'
        required: true
        default: submit
        type: choice
        options:
          - submit
          - verify
  schedule:
    - cron: '12 8,20 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/toppsarena-backlinks.yml'
      - 'scripts/verified-campaign.mjs'
      - 'scripts/backlink-helpers.mjs'
      - 'scripts/launchagentic.mjs'
      - 'scripts/postlaunchkit.mjs'
      - 'scripts/launchsignal.mjs'
      - 'scripts/submission-policy.mjs'
      - 'scripts/evidence-merge.mjs'
      - 'scripts/save-evidence.mjs'
      - 'tests/backlink-helpers.test.mjs'
      - 'tests/launchagentic.test.mjs'
      - 'tests/postlaunchkit.test.mjs'
      - 'tests/launchsignal.test.mjs'
      - 'tests/submission-policy.test.mjs'
      - 'campaign/verified-opportunities.json'
      - 'campaign/qualified-outreach.json'

permissions:
  contents: write

concurrency:
  group: toppsarena-verified-public-links
  cancel-in-progress: false

jobs:
  verify:
    name: Free API submissions and published-link checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAMPAIGN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'submit' }}
      TOPPSARENA_CONTACT_EMAIL: ${{ vars.TOPPSARENA_CONTACT_EMAIL || 'notifications@toppsarena.com' }}
    steps:
      - name: Fetch campaign and saved evidence
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate verification-first runner
        run: |
          node --check scripts/verified-campaign.mjs
          node --check scripts/backlink-helpers.mjs
          node --check scripts/launchagentic.mjs
          node --check scripts/postlaunchkit.mjs
          node --check scripts/launchsignal.mjs
          node --check scripts/submission-policy.mjs
          node --check scripts/evidence-merge.mjs
          node --check scripts/save-evidence.mjs
          node --test tests/*.test.mjs

      - name: Submit only via approved free public APIs and verify actual backlink pages
        run: node scripts/verified-campaign.mjs

      - name: Show strict publication report
        if: always()
        run: |
          if [ -f reports/verified-backlinks.md ]; then
            cat reports/verified-backlinks.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save merged evidence safely without git rebase conflicts
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/save-evidence.mjs

      - name: Upload full API and backlink verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toppsarena-published-backlink-evidence
          path: |
            state/reliable-campaign.json
            reports/verified-backlinks.md
          if-no-files-found: warn
          retention-days: 30
